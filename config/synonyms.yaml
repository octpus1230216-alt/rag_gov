# =============================================================================
# rag-zh 中文同义词表（供模糊检索扩展 + 精确检索 query rewrite 使用）
#
# 格式：{主词: [同义词1, 同义词2, ...]}
#   - 加载后程序会自动构建「双向展开」：命中任意同义词 -> 展开为主词 + 全部同义词
#   - 主词只作为归一化锚点，不要求它在原文中出现
#   - 值列表里的词不要再作为其他条目的主词，避免展开成环
#   - 中英混排是允许的（NDA / KPI / deadline 等职场惯用缩写）
#
# 使用约束（重要）：
#   同义词扩展只作用于 exact(FTS5) 与 fuzzy(RapidFuzz/n-gram) 两路的「查询侧」，
#   不做 doc 侧改写；扩展词带来的候选必须照常进入加权 RRF + Rerank，
#   绝不允许把扩展命中结果直接送进 LLM。
#
# 规模：73 组 / 312 个词条，覆盖财务 / 法律 / 人事 / 业务 / 技术 / 通用 六大类
# =============================================================================

